name: deploy-docs
on: workflow_call
jobs:
  deploy_docs:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub pages
        uses: actions/deploy-pages@v4
        id: deployment
