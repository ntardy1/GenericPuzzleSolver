name: continuous-integration
on:
  push:
    branches: [ "main" ]
jobs:
  build_app:
    uses: ./.github/workflows/build-app.yml
  build_docs:
    uses: ./.github/workflows/build-docs.yml
  deploy_docs:
    needs: build_docs
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-docs.yml
