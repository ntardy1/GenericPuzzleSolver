name: verify_pull_request
on:
  - pull_request:
      types: [opened, synchronize, reopened]
      branches: [ "main" ]
jobs:
  build_app:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/workflows/build-app.yml
  build_docs:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/workflows/build-docs.yml
